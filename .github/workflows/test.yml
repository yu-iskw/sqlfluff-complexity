name: Test python

on:
  pull_request:
    paths:
      - .github/workflows/test.yml
      - Makefile
      - dev/test_python.sh
      - noxfile.py
      - pyproject.toml
      - src/sqlfluff_complexity/**/*.py
      - src/sqlfluff_complexity/tests/fixtures/**
      - .pylintrc
  push:
    branches:
      - main
    paths:
      - .github/workflows/test.yml
      - Makefile
      - dev/test_python.sh
      - noxfile.py
      - pyproject.toml
      - src/sqlfluff_complexity/**/*.py
      - src/sqlfluff_complexity/tests/fixtures/**
      - .pylintrc
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHON_PACKAGE_NAME: sqlfluff_complexity
      PYTEST_XDIST_WORKERS: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          bash dev/setup.sh --deps "development"
      - name: Install test interpreters
        run: |
          uv python install 3.10 3.11 3.12
      - name: Vulture (dead code)
        run: |
          uv run vulture
      - name: Run tests
        run: |
          uv run nox -s tests
      - name: Test build
        run: |
          uv run bash dev/build.sh
