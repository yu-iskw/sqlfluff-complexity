# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.26.0
    - node@24.14.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  # dev/bootstrap_exp_fixtures.py builds static SQL literals; Bandit B608 is noise there only.
  ignore:
    - linters: [bandit]
      paths: [dev/bootstrap_exp_fixtures.py]
  disabled:
    - checkov
    - trufflehog
    - isort
    - black
    - mypy
  enabled:
    - actionlint@1.7.12
    - markdown-link-check@3.15.0
    - pyright@1.1.413
    - ruff@0.16.5:
        commands: [lint, format]
    - pylint@4.0.8
    - semgrep@1.176.0
    - pre-commit-hooks@5.0.0
    - trivy@0.74.0
    - osv-scanner@2.5.1
    - bandit@1.9.4
    - shellcheck@0.11.0
    - shfmt@3.14.0
    - taplo@0.10.0
    - yamllint@1.38.0
    - git-diff-check
    - markdownlint@0.49.1
    - prettier@3.9.6
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
